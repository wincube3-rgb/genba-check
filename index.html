<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>現場セルフチェック</title>
<meta name="description" content="研修・フォローアップ向け 現場セルフチェックアプリ">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3d5a75">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="セルフチェック">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#f1eee5;
  --paper:#fffdf9;
  --paper-raised:#ffffff;
  --ink:#241f18;
  --ink-dim:#6b6151;
  --line:#ddd4c0;
  --line-soft:#e9e2d2;
  --accent:#3d5a75;
  --accent-ink:#ffffff;
  --accent-soft:#e2e9ee;
  --success:#3f8a52;
  --success-soft:#e6f0e4;
  --warning:#b9791f;
  --warning-soft:#faf0da;
  --danger:#bf3f37;
  --danger-soft:#fbe8e6;
  --cond:#6f5f9c;
  --cond-soft:#ece7f6;
  --radius:14px;
  --shadow:0 1px 2px rgba(30,25,15,.06), 0 10px 28px -16px rgba(30,25,15,.28);
  --font-ui:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic Medium","Noto Sans JP",system-ui,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Consolas,"Noto Sans JP",monospace;
  --statusbar-h:44px;
  --homebar-h:30px;
  --chassis:#20211d;
  --chassis-edge:#3a3b34;
  color-scheme: light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#15130f;
    --paper:#1e1b15;
    --paper-raised:#26221a;
    --ink:#f0ebe0;
    --ink-dim:#ab9f89;
    --line:#38321f;
    --line-soft:#2c2819;
    --accent:#8caecd;
    --accent-ink:#0e1a22;
    --accent-soft:#20303c;
    --success:#79c98d;
    --success-soft:#1a3020;
    --warning:#e0aa5a;
    --warning-soft:#2e2515;
    --danger:#e5766c;
    --danger-soft:#33201d;
    --cond:#b7a3e6;
    --cond-soft:#241f36;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15130f; --paper:#1e1b15; --paper-raised:#26221a; --ink:#f0ebe0; --ink-dim:#ab9f89;
  --line:#38321f; --line-soft:#2c2819; --accent:#8caecd; --accent-ink:#0e1a22; --accent-soft:#20303c;
  --success:#79c98d; --success-soft:#1a3020; --warning:#e0aa5a; --warning-soft:#2e2515;
  --danger:#e5766c; --danger-soft:#33201d; --cond:#b7a3e6; --cond-soft:#241f36; color-scheme: dark;
}
:root[data-theme="light"]{
  --bg:#f1eee5; --paper:#fffdf9; --paper-raised:#ffffff; --ink:#241f18; --ink-dim:#6b6151;
  --line:#ddd4c0; --line-soft:#e9e2d2; --accent:#3d5a75; --accent-ink:#ffffff; --accent-soft:#e2e9ee;
  --success:#3f8a52; --success-soft:#e6f0e4; --warning:#b9791f; --warning-soft:#faf0da;
  --danger:#bf3f37; --danger-soft:#fbe8e6; --cond:#6f5f9c; --cond-soft:#ece7f6; color-scheme: light;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-ui);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

/* ---- stage / phone frame ---- */
.stage{
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;
  padding:36px 18px;
  background:
    radial-gradient(120% 90% at 50% -10%, var(--accent-soft), transparent 60%),
    var(--bg);
}
.stage-caption{
  font-size:.76rem;
  color:var(--ink-dim);
  text-align:center;
  max-width:340px;
}
.stage-caption b{color:var(--ink);}
.phone-frame{
  position:relative;
  width:min(390px, 88vw);
  height:min(844px, 84dvh);
  aspect-ratio:390/844;
  background:linear-gradient(160deg, var(--chassis-edge), var(--chassis) 40%);
  border-radius:52px;
  padding:14px;
  box-shadow:
    0 30px 60px -20px rgba(10,20,17,.45),
    0 2px 0 rgba(255,255,255,.04) inset;
}
.phone-frame::before{
  content:"";
  position:absolute;
  right:-3px; top:120px;
  width:3px; height:70px;
  background:var(--chassis-edge);
  border-radius:2px 0 0 2px;
}
.phone-frame::after{
  content:"";
  position:absolute;
  left:-3px; top:96px;
  width:3px; height:36px;
  background:var(--chassis-edge);
  border-radius:0 2px 2px 0;
  box-shadow:0 52px 0 var(--chassis-edge);
}
.phone-screen{
  position:relative;
  width:100%;
  height:100%;
  background:var(--bg);
  border-radius:38px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.app-scroll{
  flex:1;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  position:relative;
}
.app-scroll::-webkit-scrollbar{display:none;}
.app-overlay{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:25;
}
.app-overlay > *{ pointer-events:auto; }
.notch{
  position:absolute;
  top:10px; left:50%;
  transform:translateX(-50%);
  width:110px; height:26px;
  background:var(--chassis);
  border-radius:16px;
  z-index:16;
}
.status-bar{
  position:absolute;
  top:0; left:0; right:0;
  height:var(--statusbar-h);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 26px 0 22px;
  z-index:15;
  font-family:var(--font-mono);
  font-variant-numeric:tabular-nums;
  font-size:.8rem;
  font-weight:700;
  color:var(--ink);
  pointer-events:none;
}
.status-icons{display:flex;align-items:center;gap:5px;}
.status-icons svg{display:block;}
.home-indicator{
  position:absolute;
  left:50%; bottom:8px;
  transform:translateX(-50%);
  width:126px; height:5px;
  border-radius:99px;
  background:var(--ink);
  opacity:.55;
  z-index:16;
  pointer-events:none;
}
@media (max-width:640px){
  .stage{padding:0; background:var(--bg);}
  .stage-caption{display:none;}
  .phone-frame{
    width:100%; height:100dvh; max-width:none; aspect-ratio:auto;
    border-radius:0; padding:0; box-shadow:none; background:none;
  }
  .phone-frame::before, .phone-frame::after, .notch, .status-bar, .home-indicator{display:none;}
  .phone-screen{border-radius:0;}
  :root{--statusbar-h:0px; --homebar-h:0px;}
}

/* ---- app ---- */
.app{
  max-width:520px;
  margin:0 auto;
  min-height:100%;
  display:flex;
  flex-direction:column;
  padding-top:var(--statusbar-h);
  padding-bottom:calc(96px + var(--homebar-h));
}
.topbar{
  padding:18px 18px 14px;
  border-bottom:1px solid var(--line-soft);
}
.topbar-row{display:flex;align-items:center;gap:10px;}
.brand-logo{height:34px;width:auto;display:block;flex-shrink:0;}
.brand-logo-sm{height:20px;width:auto;display:block;flex-shrink:0;}
.topbar h1{
  font-size:1.05rem;
  font-weight:700;
  margin:0 0 2px;
  letter-spacing:.01em;
}
.topbar .sub{
  font-size:.78rem;
  color:var(--ink-dim);
}
.info-panel{
  margin:14px 18px 0;
  background:var(--accent-soft);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:14px 16px;
  font-size:.8rem;
  color:var(--ink);
}
.info-panel summary{
  cursor:pointer;
  font-weight:700;
  font-size:.82rem;
  list-style:none;
  display:flex;
  align-items:center;
  gap:6px;
}
.info-panel summary::-webkit-details-marker{display:none;}
.info-panel summary::before{content:"▸";font-size:.7rem;color:var(--accent);transition:transform .15s;}
.info-panel[open] summary::before{transform:rotate(90deg);}
.info-panel ul{margin:10px 0 0;padding-left:1.1em;}
.info-panel li{margin-bottom:7px;}
.info-panel li:last-child{margin-bottom:0;}
.info-panel .tag{
  display:inline-block;
  font-size:.68rem;
  font-weight:700;
  padding:1px 7px;
  border-radius:999px;
  background:var(--success-soft);
  color:var(--success);
  margin-right:4px;
}
.info-panel .tag.pay{background:var(--warning-soft);color:var(--warning);}

.section{padding:16px 18px;}
.section-title{
  font-size:.72rem;
  font-weight:700;
  letter-spacing:.08em;
  color:var(--ink-dim);
  text-transform:uppercase;
  margin:0 0 10px;
}
.field label{
  display:block;
  font-size:.78rem;
  color:var(--ink-dim);
  margin-bottom:6px;
}
.field input[type=text],
.field input[type=date]{
  width:100%;
  font-family:var(--font-ui);
  font-size:.95rem;
  padding:11px 13px;
  border-radius:10px;
  border:1px solid var(--line);
  background:var(--paper);
  color:var(--ink);
}
.field input:focus{outline:2px solid var(--accent);outline-offset:1px;}
.field-row{display:flex;gap:10px;flex-wrap:wrap;}
.field-row .field{flex:1;min-width:150px;}

.stepper-list{
  display:flex;
  flex-direction:column;
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
  background:var(--paper);
}
.stepper-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 14px;
  border-bottom:1px solid var(--line-soft);
}
.stepper-row:last-child{border-bottom:none;}
.stepper-row .name{font-size:.92rem;font-weight:600;}
.stepper-row .count-hint{font-size:.72rem;color:var(--ink-dim);font-weight:400;display:block;margin-top:1px;}
.stepper{
  display:flex;
  align-items:center;
  gap:10px;
}
.stepper button{
  width:30px;height:30px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--paper-raised);
  color:var(--ink);
  font-size:1rem;
  font-family:var(--font-mono);
  cursor:pointer;
}
.stepper button:disabled{opacity:.35;cursor:not-allowed;}
.stepper button:active:not(:disabled){background:var(--accent-soft);}
.stepper .count{
  min-width:1.4em;
  text-align:center;
  font-family:var(--font-mono);
  font-variant-numeric:tabular-nums;
  font-weight:700;
}

.btn-primary{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:none;
  background:var(--accent);
  color:var(--accent-ink);
  font-size:.96rem;
  font-weight:700;
  font-family:var(--font-ui);
  cursor:pointer;
  margin-top:18px;
}
.btn-primary:active{opacity:.85;}
.btn-secondary{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid var(--line);
  background:transparent;
  color:var(--ink);
  font-size:.88rem;
  font-weight:600;
  font-family:var(--font-ui);
  cursor:pointer;
}
.link-btn{
  background:none;border:none;color:var(--accent);font-size:.78rem;font-weight:700;
  font-family:var(--font-ui);cursor:pointer;padding:4px 0;
}

/* ---- home / report list ---- */
.report-list{display:flex;flex-direction:column;gap:8px;}
.report-card{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--paper);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;cursor:pointer;box-shadow:var(--shadow);
  text-align:left;
}
.report-card-main{min-width:0;}
.report-name{font-weight:700;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.report-meta{font-size:.74rem;color:var(--ink-dim);margin-top:2px;font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
.report-card-side{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.status-pill{font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--warning-soft);color:var(--warning);white-space:nowrap;}
.status-pill.done{background:var(--success-soft);color:var(--success);}
.icon-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--paper-raised);color:var(--ink-dim);font-size:.85rem;cursor:pointer;flex-shrink:0;}
.empty-note{font-size:.82rem;color:var(--ink-dim);padding:20px;text-align:center;border:1px dashed var(--line);border-radius:12px;}

.sticky-header{
  position:sticky;top:var(--statusbar-h);z-index:5;
  background:var(--bg);
  padding:14px 18px 12px;
  border-bottom:1px solid var(--line-soft);
}
.sticky-top-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px;
}
.pname-group{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap;}
.sticky-top-row .pname{font-weight:700;font-size:.95rem;}
.pdate{font-size:.72rem;color:var(--ink-dim);font-weight:600;font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;}
.header-links{display:flex;gap:12px;flex-shrink:0;}
.progress-wrap{display:flex;align-items:center;gap:10px;}
.progress-track{
  flex:1;height:8px;border-radius:99px;background:var(--line-soft);overflow:hidden;
}
.progress-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .25s ease;}
.progress-label{
  font-family:var(--font-mono);font-variant-numeric:tabular-nums;
  font-size:.76rem;font-weight:700;color:var(--ink-dim);white-space:nowrap;
}

.room-list{padding:14px 18px 8px;display:flex;flex-direction:column;gap:10px;}
.room-card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:var(--shadow);
}
.room-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 15px;cursor:pointer;
}
.room-head .rname{font-weight:700;font-size:.92rem;}
.room-head-right{display:flex;align-items:center;gap:8px;}
.room-badge{
  font-family:var(--font-mono);font-variant-numeric:tabular-nums;
  font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:99px;
  background:var(--line-soft);color:var(--ink-dim);
}
.room-badge.done{background:var(--success-soft);color:var(--success);}
.room-badge-total{font-weight:400;opacity:.75;}
.chev{font-size:.7rem;color:var(--ink-dim);transition:transform .15s;}
.room-card.open .chev{transform:rotate(90deg);}
.room-body{display:none;padding:0 12px 14px;}
.room-card.open .room-body{display:block;}
.item-grid{display:flex;flex-direction:column;gap:6px;}
.item-row{
  display:flex;align-items:center;gap:8px;
  padding:9px 8px;border-radius:10px;
  border:1px dashed var(--line);
}
.item-row.cond{border-style:dashed;}
.item-row.done{border-style:solid;border-color:var(--success);background:var(--success-soft);}
.item-thumb{
  width:36px;height:36px;border-radius:7px;flex-shrink:0;
  background:var(--paper);
  display:flex;align-items:center;justify-content:center;
  border:2px solid var(--line);padding:0;cursor:pointer;position:relative;color:transparent;font-size:1.15rem;
}
.item-thumb.done-thumb{background:var(--success);color:var(--paper);border-color:var(--success);font-weight:700;}
.item-info{flex:1;min-width:0;}
.item-label{font-size:.86rem;font-weight:600;line-height:1.35;}
.item-note{font-size:.72rem;color:var(--ink-dim);margin-top:1px;}
.req-pill{
  flex-shrink:0;font-size:.68rem;font-weight:700;padding:5px 9px;border-radius:99px;
  border:1px solid var(--line);background:var(--paper-raised);color:var(--ink-dim);cursor:pointer;
  font-family:var(--font-ui);
}
.req-pill.optional{background:var(--cond-soft);color:var(--cond);border-color:transparent;}
.claim-tag{
  display:inline-flex;align-items:center;gap:3px;flex-shrink:0;
  font-size:.64rem;font-weight:700;padding:3px 8px;border-radius:99px;
  background:var(--warning-soft);color:var(--warning);white-space:nowrap;
}
.item-row.claim{border-color:var(--warning);}
.item-row.claim.done{border-color:var(--success);}

.bottom-bar{
  position:absolute;left:0;right:0;bottom:var(--homebar-h);
  display:flex;justify-content:center;
  padding:12px 18px;
  background:linear-gradient(to top, var(--bg) 60%, transparent);
}
.bottom-bar-inner{width:100%;max-width:520px;}
.check-btn{
  width:100%;padding:15px;border-radius:14px;border:none;
  background:var(--ink);color:var(--bg);font-weight:700;font-size:.95rem;
  font-family:var(--font-ui);cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:var(--shadow);
}
.check-btn .miss-badge{
  background:var(--danger);color:#fff;font-family:var(--font-mono);
  font-size:.74rem;font-weight:700;padding:1px 8px;border-radius:99px;
}
.check-btn .ok-badge{
  background:var(--success);color:#fff;font-size:.74rem;font-weight:700;padding:1px 8px;border-radius:99px;
}

.modal-overlay{
  position:absolute;inset:0;background:rgba(10,20,17,.5);
  display:flex;align-items:flex-end;justify-content:center;z-index:20;
}
.modal-sheet{
  width:100%;max-width:520px;background:var(--paper);
  border-radius:20px 20px 0 0;padding:20px 20px calc(20px + var(--homebar-h));
  max-height:82%;overflow-y:auto;
}
.modal-sheet h2{font-size:1rem;margin:0 0 4px;}
.modal-sheet .modal-sub{font-size:.8rem;color:var(--ink-dim);margin-bottom:14px;}
.modal-success{
  background:var(--success-soft);color:var(--success);border-radius:12px;
  padding:14px;font-weight:700;font-size:.88rem;text-align:center;margin-bottom:12px;
}
.miss-group{margin-bottom:12px;}
.miss-group h3{font-size:.8rem;margin:0 0 6px;color:var(--ink-dim);}
.miss-item{
  display:flex;align-items:center;gap:8px;font-size:.85rem;
  padding:7px 10px;border-radius:8px;background:var(--danger-soft);color:var(--danger);
  margin-bottom:5px;font-weight:600;
}
.reason-box{
  width:100%;min-height:64px;border-radius:10px;border:1px solid var(--line);
  background:var(--paper-raised);color:var(--ink);font-family:var(--font-ui);
  font-size:.85rem;padding:10px 12px;margin:6px 0 14px;resize:vertical;
}
.modal-actions{display:flex;flex-direction:column;gap:8px;}
.toast{
  position:absolute;left:50%;bottom:calc(26px + var(--homebar-h));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;
  font-size:.82rem;font-weight:700;z-index:30;box-shadow:var(--shadow);
  max-width:85%;text-align:center;
}
.preason{font-size:.72rem;color:var(--cond);font-weight:700;background:var(--cond-soft);padding:1px 8px;border-radius:99px;white-space:nowrap;}
.hidden{display:none !important;}
@media (prefers-reduced-motion: reduce){
  .progress-fill, .chev, .info-panel summary::before{transition:none;}
}
</style>
</head>
<body>


<div class="stage">
  <div class="stage-caption"><b>プレビュー用の実機フレーム表示</b>です。スマホのブラウザで開くと、そのまま全画面のアプリとして操作できます。</div>
  <div class="phone-frame">
    <div class="notch"></div>
    <div class="phone-screen">
      <div class="status-bar">
        <span class="status-time">9:41</span>
        <span class="status-icons">
          <svg width="18" height="10" viewBox="0 0 18 10" fill="none"><rect x="0" y="6" width="3" height="4" rx=".5" fill="currentColor"/><rect x="5" y="4" width="3" height="6" rx=".5" fill="currentColor"/><rect x="10" y="2" width="3" height="8" rx=".5" fill="currentColor"/><rect x="15" y="0" width="3" height="10" rx=".5" fill="currentColor"/></svg>
          <svg width="22" height="11" viewBox="0 0 22 11" fill="none"><rect x=".5" y=".5" width="18" height="10" rx="2.5" stroke="currentColor"/><rect x="2" y="2" width="15" height="7" rx="1.3" fill="currentColor"/><rect x="19.5" y="3.5" width="1.6" height="4" rx=".8" fill="currentColor"/></svg>
        </span>
      </div>
      <div class="app-scroll app" id="appScroll"></div>
      <div class="app-overlay" id="appOverlay"></div>
      <div class="home-indicator"></div>
    </div>
  </div>
</div>

<script>
function tickClock(){
  const el = document.querySelector('.status-time');
  if(!el) return;
  const d = new Date();
  el.textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0');
}

function normItem(it){
  return typeof it === 'string' ? {label:it, note:null, cond:false, claim:false} : {label:it.label, note:it.note||null, cond:!!it.cond, claim:!!it.claim};
}
function buildRoomsFromCounts(counts){
  const rooms = [];
  SECTIONS.forEach(sec=>{
    const n = counts[sec.key] || 0;
    for(let i=1;i<=n;i++){
      const roomId = sec.key + '_' + i;
      rooms.push({
        id: roomId,
        label: n>1 ? sec.label + i : sec.label,
        open: false,
        items: sec.items.map(normItem).map((it, idx)=>({
          id: roomId + '__' + idx,
          label: it.label,
          note: it.note,
          optional: it.cond,
          claim: it.claim,
          done: false
        }))
      });
    }
  });
  if(rooms.length) rooms[0].open = true;
  return rooms;
}

/* ---- IndexedDB persistence ---- */
const DB_NAME = 'shooting_assist_db';
const STORE = 'reports';
function openDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, {keyPath:'id'});
    };
    req.onsuccess = e=>resolve(e.target.result);
    req.onerror = e=>reject(e.target.error);
  });
}
async function dbPut(report){
  const db = await openDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(report);
    tx.oncomplete = ()=>resolve();
    tx.onerror = e=>reject(e.target.error);
  });
}
async function dbGetAll(){
  const db = await openDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = ()=>resolve(req.result || []);
    req.onerror = e=>reject(e.target.error);
  });
}
async function dbDelete(id){
  const db = await openDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = ()=>resolve();
    tx.onerror = e=>reject(e.target.error);
  });
}

function todayStr(){
  const d = new Date();
  const p = n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function newId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

const DEFAULT_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyPNILmZj6mo13yNv2z1JRECNz3msuky-16_9JBbGlqR_qZF5hd71tIaP8I14ikujvtFQ/exec';

function loadWebAppUrl(){
  try{
    const override = localStorage.getItem('webAppUrlOverride');
    return (override != null && override !== '') ? override : DEFAULT_WEB_APP_URL;
  }catch(e){ return DEFAULT_WEB_APP_URL; }
}
function saveWebAppUrl(url){
  try{
    if(url && url !== DEFAULT_WEB_APP_URL) localStorage.setItem('webAppUrlOverride', url);
    else localStorage.removeItem('webAppUrlOverride');
  }catch(e){ /* ignore */ }
}

function requiredItems(report){ return report.rooms.flatMap(r=>r.items).filter(it=>!it.optional); }
function missingRequired(report){
  return report.rooms.map(r=>({room:r, missing:r.items.filter(it=>!it.optional && !it.done)})).filter(g=>g.missing.length);
}

async function persist(){
  if(!state.currentReport) return;
  state.currentReport.updatedAt = new Date().toISOString();
  try{
    await dbPut(state.currentReport);
  }catch(e){
    console.error('save failed', e);
    state.toast = '⚠ 記録の保存に失敗しました(' + (e && e.name ? e.name : 'エラー') + ')。';
    render();
    setTimeout(()=>{ state.toast=null; render(); }, 6000);
  }
}
async function boot(){
  state.webAppUrl = loadWebAppUrl();
  try{ state.reports = await dbGetAll(); }catch(e){ console.error(e); state.reports = []; }
  render();
}

async function submitReport(){
  if(!state.webAppUrl || !state.currentReport) return;
  const report = state.currentReport;
  const req = requiredItems(report);
  const done = req.filter(it=>it.done).length;
  const missingItems = report.rooms.flatMap(r=>r.items.filter(it=>!it.optional && !it.done).map(it=>r.label+':'+it.label));
  const payload = {
    propertyName: report.propertyName,
    date: report.date,
    reason: report.reason,
    requiredTotal: req.length,
    requiredDone: done,
    requiredMissing: req.length - done,
    completionRate: req.length ? Math.round(done/req.length*100) : 100,
    missingList: missingItems.join(' / ')
  };
  state.showSubmit = false;
  state.toast = '送信中…';
  render();
  try{
    const res = await fetch(state.webAppUrl, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    });
    const json = await res.json().catch(()=>null);
    if(json && json.status === 'ok'){
      report.sheetSubmitted = true;
      report.sheetSubmittedAt = new Date().toISOString();
      await persist();
      state.toast = 'スプレッドシートに送信しました';
    } else {
      state.toast = '送信に失敗しました(応答が正しくありません)';
    }
  }catch(err){
    console.error('submit failed', err);
    state.toast = '送信に失敗しました。プレビュー環境では通信が制限されているため、正式配布後の環境で改めてお試しください。';
  }
  render();
  setTimeout(()=>{ state.toast=null; render(); }, 6000);
}

async function handleGenerate(){
  const nameInput = document.getElementById('propertyNameInput');
  const dateInput = document.getElementById('reportDateInput');
  const reasonInput = document.getElementById('reportReasonInput');
  const propertyName = nameInput ? nameInput.value : '';
  const date = (dateInput && dateInput.value) ? dateInput.value : todayStr();
  const reason = reasonInput ? reasonInput.value : '';
  const isEdit = !!(state.currentReport && state.currentReport.id);
  const hasProgress = isEdit && state.currentReport.rooms.some(r=>r.items.some(it=>it.done));
  if(hasProgress && !confirm('構成を変更すると、部屋ごとのチェック状況が引き継がれない場合があります。続けますか？')) return;

  const id = isEdit ? state.currentReport.id : newId();
  const createdAt = isEdit ? state.currentReport.createdAt : new Date().toISOString();
  const status = isEdit ? state.currentReport.status : 'in_progress';
  const rooms = buildRoomsFromCounts(state.counts);
  const report = {id, propertyName, date, reason, counts: Object.assign({}, state.counts), rooms, status, createdAt, updatedAt: new Date().toISOString()};
  state.currentReport = report;
  await persist();
  state.screen = 'checklist';
  render();
}

function render(){
  const scrollEl = document.getElementById('appScroll');
  const overlayEl = document.getElementById('appOverlay');
  if(state.screen === 'home') scrollEl.innerHTML = renderHome();
  else if(state.screen === 'setup') scrollEl.innerHTML = renderSetup();
  else scrollEl.innerHTML = renderChecklist();
  overlayEl.innerHTML = renderOverlay();
}

function renderOverlay(){
  let html = '';
  if(state.screen === 'checklist' && state.currentReport){
    const report = state.currentReport;
    const missGroups = missingRequired(report);
    const missCount = missGroups.reduce((s,g)=>s+g.missing.length,0);
    html += `
      <div class="bottom-bar"><div class="bottom-bar-inner">
        <button class="check-btn" data-action="open-summary">
          チェック漏れ確認
          ${missCount>0 ? `<span class="miss-badge">未確認 ${missCount}</span>` : `<span class="ok-badge">OK</span>`}
        </button>
      </div></div>
      ${renderModal(missGroups)}
      ${renderSubmit()}
    `;
  }
  html += renderSettings();
  html += state.toast ? `<div class="toast">${escapeHtml(state.toast)}</div>` : '';
  return html;
}

    <div class="modal-overlay" data-action="close-summary">
      <div class="modal-sheet" data-action="noop">
        <h2>チェック漏れ確認</h2>
        <div class="modal-sub">必須項目の確認状況を確認しました</div>
        <div class="modal-success">✓ 必須項目はすべて確認済みです。</div>
        <div class="modal-actions">
          <button class="btn-primary" data-action="mark-submitted">完了として保存して閉じる</button>
        </div>
      </div>
    </div>`;
  }
  const groupsHtml = missGroups.map(g=>`
    <div class="miss-group">
      <h3>${g.room.label}</h3>
      ${g.missing.map(it=>`<div class="miss-item">未確認：${it.label}</div>`).join('')}
    </div>
  `).join('');
  return `
    <div class="modal-overlay" data-action="close-summary">
      <div class="modal-sheet" data-action="noop">
        <h2>チェック漏れ確認</h2>
        <div class="modal-sub">必須項目が ${missCount} 件未確認です</div>
        ${groupsHtml}
        <div class="section-title" style="margin-top:6px;">このまま進む場合は理由を記録してください</div>
        <textarea class="reason-box" id="overrideReason" placeholder="例) 現地に該当設備なし／時間切迫のため後で確認 など"></textarea>
        <div class="modal-actions">
          <button class="btn-secondary" data-action="close-summary">戻って確認する</button>
          <button class="btn-primary" data-action="confirm-override">理由を記録して次へ進む</button>
        </div>
      </div>
    </div>`;
}

function renderSettings(){
  if(!state.showSettings) return '';
  return `
    <div class="modal-overlay" data-action="close-settings">
      <div class="modal-sheet" data-action="noop">
        <h2>スプレッドシート連携設定</h2>
        <div class="modal-sub">提出先のスプレッドシートは最初から設定済みです。通常はここで何もする必要はありません。別のシートに変更したい場合のみ、下にURLを貼り付けてください。</div>
        <div class="field" style="margin-bottom:14px;">
          <label for="webAppUrlInput">ウェブアプリのURL(上書き・任意)</label>
          <input type="text" id="webAppUrlInput" placeholder="https://script.google.com/macros/s/.../exec" value="${escapeAttr(state.webAppUrl)}">
        </div>
        <div class="modal-actions">
          <button class="btn-primary" data-action="save-settings">保存</button>
          <button class="btn-secondary" data-action="reset-settings">既定のシートに戻す</button>
          <button class="btn-secondary" data-action="close-settings">閉じる</button>
        </div>
      </div>
    </div>`;
}

function renderSubmit(){
  if(!state.showSubmit || !state.currentReport) return '';
  const report = state.currentReport;
  const req = requiredItems(report);
  const done = req.filter(it=>it.done).length;
  const missing = req.length - done;
  return `
    <div class="modal-overlay" data-action="close-submit">
      <div class="modal-sheet" data-action="noop">
        <h2>スプレッドシートに提出</h2>
        <div class="modal-sub">${report.propertyName ? escapeHtml(report.propertyName) : '(物件名未設定)'} ・ 必須 ${done}/${req.length}${missing>0?`(未確認 ${missing}件)`:''}</div>
        ${!state.webAppUrl?`<div class="empty-note">連携設定が未登録です。先にURLを登録してください。</div>`:''}
        <div class="modal-actions" style="margin-top:14px;">
          ${state.webAppUrl
            ? `<button class="btn-primary" data-action="submit-report">送信する</button>`
            : `<button class="btn-primary" data-action="open-settings-from-submit">連携設定を開く</button>`}
          <button class="btn-secondary" data-action="close-submit">キャンセル</button>
        </div>
      </div>
    </div>`;
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s||''); }

document.addEventListener('click', e=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;

  if(action==='new-report'){
    enterSetup(null);
  } else if(action==='open-report'){
    const r = state.reports.find(r=>r.id===t.dataset.id);
    if(r) openReport(r);
  } else if(action==='delete-report'){
    e.stopPropagation();
    if(confirm('このチェックリストを削除しますか？')){
      deleteReportById(t.dataset.id);
    }
  } else if(action==='go-home'){
    goHome();
  } else if(action==='edit-setup'){
    enterSetup(state.currentReport);
  } else if(action==='dec' || action==='inc'){
    const sec = SECTIONS.find(s=>s.key===t.dataset.sec);
    const cur = state.counts[sec.key];
    state.counts[sec.key] = action==='inc' ? Math.min(sec.max, cur+1) : Math.max(sec.min, cur-1);
    render();
  } else if(action==='generate'){
    handleGenerate();
  } else if(action==='toggle-room'){
    const r = state.currentReport.rooms.find(r=>r.id===t.dataset.room);
    r.open = !r.open;
    render();
  } else if(action==='toggle-done'){
    const r = state.currentReport.rooms.find(r=>r.id===t.dataset.room);
    const it = r.items.find(it=>it.id===t.dataset.item);
    it.done = !it.done;
    persist();
    render();
  } else if(action==='toggle-optional'){
    const r = state.currentReport.rooms.find(r=>r.id===t.dataset.room);
    const it = r.items.find(it=>it.id===t.dataset.item);
    it.optional = !it.optional;
    persist();
    render();
  } else if(action==='open-settings'){
    state.showSettings = true;
    render();
  } else if(action==='open-settings-from-submit'){
    state.showSubmit = false;
    state.showSettings = true;
    render();
  } else if(action==='close-settings'){
    state.showSettings = false;
    render();
  } else if(action==='save-settings'){
    const input = document.getElementById('webAppUrlInput');
    const url = input ? input.value.trim() : '';
    saveWebAppUrl(url);
    state.webAppUrl = loadWebAppUrl();
    state.showSettings = false;
    state.toast = (url && url !== DEFAULT_WEB_APP_URL) ? '独自のURLに変更しました' : '既定のシートを使用します';
    render();
    setTimeout(()=>{ state.toast=null; render(); }, 2500);
  } else if(action==='reset-settings'){
    saveWebAppUrl('');
    state.webAppUrl = loadWebAppUrl();
    state.showSettings = false;
    state.toast = '既定のシートに戻しました';
    render();
    setTimeout(()=>{ state.toast=null; render(); }, 2500);
  } else if(action==='open-submit'){
    state.showSubmit = true;
    render();
  } else if(action==='close-submit'){
    state.showSubmit = false;
    render();
  } else if(action==='submit-report'){
    submitReport();
  } else if(action==='open-summary'){
    state.showModal = true;
    render();
  } else if(action==='close-summary'){
    state.showModal = false;
    render();
  } else if(action==='confirm-override'){
    const reasonEl = document.getElementById('overrideReason');
    const reason = reasonEl ? reasonEl.value.trim() : '';
    if(!reason){ reasonEl.focus(); reasonEl.style.borderColor = 'var(--danger)'; return; }
    state.currentReport.lastOverrideReason = reason;
    state.currentReport.lastOverrideAt = new Date().toISOString();
    state.showModal = false;
    state.toast = '記録しました。理由: ' + (reason.length>24 ? reason.slice(0,24)+'…' : reason);
    persist();
    render();
    setTimeout(()=>{ state.toast=null; render(); }, 3200);
  } else if(action==='mark-submitted'){
    state.currentReport.status = 'submitted';
    state.showModal = false;
    state.toast = 'チェックリストを完了として保存しました';
    persist();
    render();
    setTimeout(()=>{ state.toast=null; render(); }, 3000);
  }
});

boot();
</script>

</body>
</html>
